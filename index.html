<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS · Discover · Collect · Repeat</title>
<meta name="description" content="NEXUS is a random discovery platform for movies, TV series, video games and anime.">
<meta name="theme-color" content="#0a1226">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b82f6'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='700' text-anchor='middle' fill='white' font-family='sans-serif'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <a class="logo" href="#discover" data-go="discover">NEXUS<i></i></a>
  <nav id="tabs" aria-label="Sections">
    <button data-view="discover">Discover</button>
    <button data-view="collection">My Collection</button>
    <button data-view="achievements">Achievements</button>
  </nav>
</header>

<main>
  <section id="v-discover" class="view">
    <div class="hero">
      <p class="tag">DISCOVER · COLLECT · REPEAT</p>
      <h1>Find your next obsession.</h1>
      <p class="intro">One click picks a movie, series, game or anime at random. Every time a title comes back, it shares two more facts about itself.</p>
      <button id="surprise" class="cta">Surprise Me</button>
      <div id="chips" class="chips" role="group" aria-label="Category">
        <button data-f="all" aria-pressed="true">Everything</button>
        <button data-f="movies" aria-pressed="false">Movies</button>
        <button data-f="series" aria-pressed="false">TV Series</button>
        <button data-f="games" aria-pressed="false">Video Games</button>
        <button data-f="anime" aria-pressed="false">Anime</button>
      </div>
    </div>
    <div id="stage" aria-live="polite"></div>
    <div id="daily" class="grid2"></div>
    <div id="stats"></div>
  </section>

  <section id="v-collection" class="view" hidden>
    <div class="head"><h2>My Collection</h2>
      <div class="tools">
        <button class="btn" id="export">Export backup</button>
        <label class="btn">Import backup<input type="file" id="import" accept="application/json,.json" hidden></label>
      </div>
    </div>
    <div id="col-tabs" class="tabs"></div>
    <div id="col-list"></div>
  </section>

  <section id="v-achievements" class="view" hidden>
    <div class="head"><h2>Achievements</h2><p id="ach-count" class="mute"></p></div>
    <div id="ach-grid" class="ach-grid"></div>
  </section>
</main>

<div id="toasts" aria-live="polite"></div>
<footer>Created by Alireza · saadatalireza2020@gmail.com</footer>
<script src="js/app.js"></script>
</body>
</html>
